<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anatomy Assessment Portal - Prof. Baloch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Dancing+Script:wght@700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 10px; }
        #main-container { width: 100%; max-width: 750px; background: white; border-radius: 2rem; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1); border-top: 10px solid #0d9488; display: flex; flex-direction: column; overflow: hidden; }
        
        /* CIRCULAR GOLD MEDALLION WITH STAR BORDER */
        .gold-medallion { 
            background: #eab308 !important; 
            background: radial-gradient(circle, #fde047 0%, #eab308 70%, #a16207 100%) !important; 
            box-shadow: 0 10px 25px rgba(234, 179, 8, 0.4); 
            border: 6px double rgba(255,255,255,0.8); 
            animation: shine 2.5s infinite ease-in-out;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        
        .signature-font { font-family: 'Dancing Script', cursive; }
        @keyframes shine { 0%, 100% { filter: brightness(1); transform: scale(1); } 50% { filter: brightness(1.1); transform: scale(1.03); } }
        
        @media print { 
            body { background: white; padding: 0; } 
            #main-container { border: none; box-shadow: none; width: 100%; max-width: 100%; margin: 0; } 
            .no-print { display: none !important; } 
            .print-padding { padding: 40px !important; } 
            .gold-medallion { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="setup-screen" class="p-8 flex flex-col space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tighter text-center">Anatomy Portal</h1>
                <p class="text-teal-600 font-bold text-base text-center">Prof. Dr. Abdul Hafeez Baloch</p>
                <p class="text-slate-500 text-[10px] lowercase tracking-widest font-medium text-center">hafeez.baloch@isra.edu.pk</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="student-name" placeholder="Full Name" class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500 text-base">
                <input type="email" id="student-email" placeholder="Email Address" class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500 text-base">
                <div class="flex gap-2">
                    <input type="text" id="student-roll" placeholder="Roll No" class="w-1/2 p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500 text-base">
                    <input type="tel" id="student-phone" placeholder="Mobile No" class="w-1/2 p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500 text-base">
                </div>
                <div class="pt-2 text-center">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Topic / Region / Module</label>
                    <select id="topic-selector" class="w-full p-3 bg-slate-50 border rounded-xl font-bold outline-none cursor-pointer focus:ring-2 focus:ring-teal-600 text-base text-center">
                        <option value="" disabled selected>-- Select Topic / Module --</option>
                        <option value="Terms_of_Movement_and_Positions.json">🦴 Terms of Movement & Positions</option>
                        <option value="Tongue_and_Salivary_Glands.json">👅 Tongue & Salivary Glands</option>
                        <option value="basic-structure.json">🧬 Basic Structure of Body</option>
                    </select>
                </div>
                <button onclick="startAssessment()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 text-lg uppercase tracking-widest transition-all">Enter Portal</button>
            </div>
        </div>

        <div id="quiz-content" class="hidden p-8 flex flex-col h-full">
            <div class="flex justify-between items-center mb-6">
                <div class="flex gap-2 font-bold">
                    <div class="px-4 py-1 bg-green-50 border border-green-200 rounded-xl text-green-700 text-xs" id="score-correct-live">0</div>
                    <div class="px-4 py-1 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs" id="score-wrong-live">0</div>
                </div>
                <div class="bg-slate-900 text-white px-4 py-1 rounded-xl font-mono font-bold text-xs" id="timer-sec">60s</div>
                <span id="q-count" class="text-slate-400 text-[10px] font-black uppercase tracking-widest">Item</span>
            </div>
            <div id="quiz-display" class="flex-grow flex flex-col justify-center min-h-[350px]"></div>
            <div class="mt-6 flex gap-3 border-t pt-6 no-print">
                <button id="peek-btn" onclick="toggleAnswer()" disabled class="flex-1 bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-sm transition-all">Show Rationale</button>
                <button id="next-btn" onclick="nextQuestion()" class="flex-[2] bg-teal-600 hover:bg-teal-700 text-white font-black py-3 rounded-xl shadow-md active:scale-95 text-base">Next Question →</button>
            </div>
        </div>

        <div id="results-screen" class="hidden p-6 text-center flex flex-col space-y-3 print-padding">
            <div id="badge-area"></div>
            <h1 class="text-xl font-black text-slate-800 uppercase tracking-tighter leading-none text-center">Assessment Achievement Record</h1>
            <p id="res-topic" class="text-teal-600 font-bold text-sm tracking-tight text-center"></p>
            <div class="mt-1 text-center">
                <p id="res-name" class="text-slate-900 font-extrabold uppercase tracking-widest text-[11px]"></p>
                <p id="res-roll-cert" class="text-slate-400 font-bold text-[9px] uppercase tracking-widest"></p>
            </div>
            <div class="flex flex-col items-center justify-center space-y-1">
                <p id="res-grade" class="text-2xl font-black tracking-tighter"></p>
                <div class="inline-block mx-auto p-4 rounded-full border-4 border-teal-50 font-black text-4xl text-teal-600" id="res-percent">0%</div>
            </div>
            <p id="res-performance" class="text-base font-bold italic text-slate-500 leading-none mb-1 text-center"></p>
            <p id="res-attempts" class="text-[9px] font-bold text-teal-500 uppercase tracking-[0.2em] text-center"></p>
            <div class="flex justify-center gap-6 border-y border-slate-50 py-2">
                <div class="text-center"><p class="text-[8px] uppercase font-black text-slate-400 tracking-widest">Correct</p><p class="text-lg font-black text-green-600" id="res-correct">0</p></div>
                <div class="w-px h-6 bg-slate-100"></div>
                <div class="text-center"><p class="text-[8px] uppercase font-black text-slate-400 tracking-widest">Incorrect</p><p class="text-lg font-black text-red-500" id="res-wrong">0</p></div>
            </div>
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 no-print">
                <textarea id="feedback-txt" class="w-full p-2 border-none rounded-lg h-14 text-xs bg-white shadow-inner outline-none focus:ring-1 focus:ring-teal-500 text-slate-800 placeholder-slate-500" placeholder="Enter reflective notes..."></textarea>
                <button onclick="submitFinalData()" class="w-full mt-1 bg-slate-800 text-white text-[8px] font-black py-2 rounded-lg uppercase tracking-widest">Submit Feedback & Score</button>
            </div>
            <div class="flex justify-between items-end mt-4 px-4">
                <div class="text-left"><p class="text-[8px] text-slate-400 uppercase font-bold tracking-widest mb-1">Date of Completion</p><p id="res-date" class="text-[11px] font-bold text-slate-700"></p></div>
                <div class="text-right"><p class="text-[8px] text-slate-400 uppercase font-bold tracking-widest mb-1">Verified By</p><p class="signature-font text-xl text-slate-800 leading-none">Prof. Abdul Hafeez Baloch</p></div>
            </div>
            <div class="flex flex-col gap-2 no-print">
                <button id="cert-btn" onclick="window.print()" class="hidden w-full bg-amber-500 text-white font-black py-2.5 rounded-xl text-xs uppercase tracking-widest shadow-md">Download Record (PDF)</button>
                <button onclick="registerRetake()" class="w-full bg-teal-600 text-white font-black py-3 rounded-xl text-xs uppercase tracking-widest shadow-md">Retake Assessment</button>
            </div>
        </div>
    </div>

    <script>
        let allQuestions = [], currentIndex = 0, currentOptions = [], hasSelected = false;
        let correctCount = 0, wrongCount = 0, timeLeft = 60, timerInterval;
        let attemptCount = localStorage.getItem('anatomy_attempts') || 1;
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbysfwHXhSTJkXXRF7PyUDNym_kqIGR3AAt6cVSbkiYDgNquTcPJbpaUdNfspcdZ09Vk/exec';
        const letters = ['A', 'B', 'C', 'D', 'E'];

       async function startAssessment() {
    const name = document.getElementById('student-name').value.trim();
    const email = document.getElementById('student-email').value.trim();
    const roll = document.getElementById('student-roll').value.trim();
    const phone = document.getElementById('student-phone').value.trim();
    const topic = document.getElementById('topic-selector').value;

    // Email validation pattern
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // Strict Validation Checks
    if (name.length < 3) {
        return alert("Please enter your full name (minimum 3 characters).");
    }
    if (!emailPattern.test(email)) {
        return alert("Please enter a valid email address (e.g., student@isra.edu.pk).");
    }
    if (!roll) {
        return alert("Please enter your Roll Number.");
    }
    if (!topic) {
        return alert("Please select a Topic / Module.");
    }

    try { 
        fetch(SCRIPT_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({ name, email, roll, phone, topic, type: 'LOGIN_ATTEMPT' }) 
        }); 
    } catch(e) {
        console.log("Analytics error:", e);
    }

    const res = await fetch(`./${topic}`);
    allQuestions = await res.json();
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('quiz-content').classList.remove('hidden');
    displayQuestion();
}

        function displayQuestion() {
            const q = allQuestions[currentIndex]; hasSelected = false;
            document.getElementById('peek-btn').disabled = true;
            document.getElementById('peek-btn').className = "flex-1 bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-sm";
            document.getElementById('q-count').innerText = `ITEM ${currentIndex + 1} / ${allQuestions.length}`;
            
            const qTxt = q.question_text || q.question || q.Question;
            const qExpl = q.explanation || q.rationale || q.Rationale;
            const qOpts = q.options || [q.A, q.B, q.C, q.D, q.E].filter(o => o !== undefined);
            const qCorrect = (q.correct_answer || q.Correct || "A").trim().toUpperCase();

            const correctText = qOpts[letters.indexOf(qCorrect)];
            currentOptions = qOpts.map(opt => ({ text: opt, isCorrect: opt === correctText }));
            currentOptions.sort(() => Math.random() - 0.5);
            
            document.getElementById('quiz-display').innerHTML = `
                <p class="text-xl font-extrabold text-slate-800 text-center leading-snug mb-6">${qTxt}</p>
                <div class="space-y-3">
                    ${currentOptions.map((opt, i) => `
                        <div id="opt-${i}" onclick="selectOption(${i})" class="p-3 border-2 rounded-xl bg-white hover:border-teal-400 cursor-pointer flex items-center shadow-sm font-bold text-slate-700 text-sm transition-all text-center">
                            <span class="w-6 h-6 flex items-center justify-center rounded-lg bg-slate-100 font-black mr-3 text-[10px] text-slate-400">${letters[i]}</span>
                            <span class="flex-grow text-center pr-6">${opt.text}</span>
                        </div>
                    `).join('')}
                </div>
                <div id="answer-box" class="hidden mt-4 p-4 bg-teal-50 rounded-xl border-l-4 border-teal-500 shadow-inner">
                    <p class="font-black text-teal-900 text-[10px] uppercase tracking-widest mb-1 underline">Clinical Rationale:</p>
                    <p class="text-slate-600 italic leading-relaxed text-xs text-justify">${qExpl}</p>
                </div>`;
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval); timeLeft = 60;
            document.getElementById('timer-sec').innerText = "60s";
            timerInterval = setInterval(() => {
                timeLeft--; 
                document.getElementById('timer-sec').innerText = timeLeft + "s";
                if (timeLeft <= 0) { clearInterval(timerInterval); selectOption(-1); }
            }, 1000);
        }

        function selectOption(idx) {
            if(hasSelected) return; hasSelected = true; clearInterval(timerInterval);
            const divs = document.querySelectorAll('[id^="opt-"]');
            divs.forEach(d => d.classList.add('opacity-40', 'pointer-events-none'));
            if (idx !== -1 && currentOptions[idx].isCorrect) {
                correctCount++; document.getElementById('score-correct-live').innerText = correctCount;
                document.getElementById(`opt-${idx}`).className = "p-3 border-2 rounded-xl bg-green-50 border-green-500 flex items-center shadow-md ring-2 ring-green-200 text-center opacity-100";
            } else {
                wrongCount++; document.getElementById('score-wrong-live').innerText = wrongCount;
                if(idx !== -1) document.getElementById(`opt-${idx}`).className = "p-3 border-2 rounded-xl bg-red-50 border-red-500 flex items-center opacity-100 text-center";
                document.getElementById(`opt-${currentOptions.findIndex(o => o.isCorrect)}`).className = "p-3 border-2 rounded-xl bg-green-50 border-green-400 flex items-center opacity-100 text-center";
            }
            document.getElementById('peek-btn').disabled = false;
            document.getElementById('peek-btn').className = "flex-1 bg-slate-800 text-white font-bold py-3 rounded-xl text-sm cursor-pointer shadow-lg";
        }

        function nextQuestion() {
            if (currentIndex < allQuestions.length - 1) { currentIndex++; displayQuestion(); } 
            else { showFinalResults(); }
        }

        function showFinalResults() {
            document.getElementById('quiz-content').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            const pct = Math.round((correctCount / allQuestions.length) * 100);
            const selector = document.getElementById('topic-selector');
            const moduleName = selector.options[selector.selectedIndex].text;
            
            document.getElementById('res-topic').innerText = "Topic: " + moduleName;
            document.getElementById('res-name').innerText = document.getElementById('student-name').value;
            document.getElementById('res-roll-cert').innerText = "Roll No: " + document.getElementById('student-roll').value;
            document.getElementById('res-percent').innerText = pct + "%";
            document.getElementById('res-correct').innerText = correctCount;
            document.getElementById('res-wrong').innerText = wrongCount;
            document.getElementById('res-date').innerText = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            
            let grade = pct === 100 ? "A+" : pct >= 90 ? "A" : pct >= 75 ? "B" : pct >= 50 ? "C" : "F";
            let color = pct >= 90 ? "text-green-600" : pct >= 50 ? "text-teal-600" : "text-red-500";
            document.getElementById('res-grade').innerText = "Grade: " + grade;
            document.getElementById('res-grade').className = `text-3xl font-black tracking-tighter ${color}`;

            document.getElementById('res-attempts').innerText = (attemptCount == 1) ? "Assessment Outcome: First Attempt Success" : `Assessment Outcome: Multiple Attempts (${attemptCount})`;
            let performance = (pct === 100) ? "EXCELLENT! CLINICAL MASTERY ACHIEVED." : (pct >= 80) ? "GREAT JOB! KEEP IT UP." : (pct >= 50) ? "GOOD! WORK HARD TO IMPROVE." : "KEEP STUDYING AND TRY AGAIN!";
            document.getElementById('res-performance').innerText = `"${performance}"`;

            if(pct === 100) {
                document.getElementById('badge-area').innerHTML = `
                <div class="mb-4 flex flex-col items-center">
                    <div class="gold-medallion w-24 h-24 rounded-full flex flex-col items-center justify-center text-white text-center shadow-lg relative border-4 border-white">
                        <span class="text-[8px] font-black uppercase tracking-[0.2em] leading-none mb-1">Excellent</span>
                        <span class="text-4xl font-black leading-none">100</span>
                        <div class="absolute -bottom-1 bg-white text-amber-600 text-[10px] px-3 py-0.5 rounded-full font-black tracking-tighter shadow-sm">★ ★ ★</div>
                    </div>
                </div>`;
                document.getElementById('cert-btn').classList.remove('hidden');
                localStorage.removeItem('anatomy_attempts');
            }
        }

        function submitFinalData() {
            fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ 
                    name: document.getElementById('student-name').value, 
                    email: document.getElementById('student-email').value, 
                    roll: document.getElementById('student-roll').value, 
                    phone: document.getElementById('student-phone').value,
                    topic: document.getElementById('topic-selector').value, 
                    score: document.getElementById('res-percent').innerText, 
                    feedback: document.getElementById('feedback-txt').value, 
                    type: 'FINAL_SCORE' 
                }) 
            });
            alert('Achievement Logged, Prof. Baloch.');
        }

        function registerRetake() {
            localStorage.setItem('anatomy_attempts', parseInt(attemptCount) + 1);
            location.reload();
        }

        function toggleAnswer() { document.getElementById('answer-box').classList.toggle('hidden'); }
    </script>
</body>
</html>
