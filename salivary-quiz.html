<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salivary Glands Assessment - Prof. Baloch</title>
    <style>
        /* [PROFESSOR: Kept your original style settings] */
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
        :root { --bg: #f6f1e7; --ink: #171717; --teal: #1f6f78; --accent: #d3542c; --card: #fff7ef; --stroke: #e3d6c5; --shadow: 0 18px 40px rgba(23, 23, 23, 0.12); }
        body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--ink); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .quiz-container { width: 100%; max-width: 800px; padding: 32px; background: var(--card); border-radius: 22px; border: 1px solid var(--stroke); box-shadow: var(--shadow); }
        .question-text { font-family: 'Space Grotesk', sans-serif; font-size: 1.5em; font-weight: 600; margin-bottom: 24px; line-height: 1.4; }
        .option-item { background: #fff; border: 1px solid var(--stroke); padding: 14px; border-radius: 12px; cursor: pointer; margin-bottom: 10px; list-style:none; }
        .option-item.selected.correct { background: rgba(31, 111, 120, 0.1); border-color: var(--teal); }
        .option-item.selected.incorrect { background: rgba(181, 72, 50, 0.1); border-color: #b54832; }
        .rationale { font-size: 0.9em; margin-top: 8px; color: #5b5b5b; display: none; }
        .selected .rationale { display: block; }
        .btn { padding: 10px 20px; border-radius: 10px; border: none; background: var(--teal); color: #fff; cursor: pointer; }
        #login-gate { text-align: center; }
        input { padding: 12px; width: 80%; margin-bottom: 10px; border: 1px solid var(--stroke); border-radius: 8px; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="login-gate">
            <h2 style="color:var(--teal)">Isra University Portal</h2>
            <p>Enter Student Details (Salivary Module):</p>
            <input type="text" id="name" placeholder="Full Name"><br>
            <input type="text" id="roll" placeholder="Roll Number"><br>
            <input type="email" id="email" placeholder="student@isra.edu.pk"><br>
            <button class="btn" onclick="startQuiz()">Enter Assessment</button>
        </div>

        <div id="quiz-ui" style="display:none;">
            <div id="quiz-content"></div>
            <div id="hint-box" style="display:none; margin-top:15px; padding:15px; border:1px solid var(--stroke); background:#fff; border-radius:10px;">💡 <span id="hint-text"></span></div>
            <div style="margin-top:25px; display:flex; justify-content:space-between;">
                <button class="btn" style="background:#fff; color:var(--ink); border:1px solid var(--stroke)" onclick="toggleHint()">Hint</button>
                <div style="display:flex; gap:10px;">
                    <button class="btn" style="background:#fff; color:var(--ink); border:1px solid var(--stroke)" onclick="prev()">Prev</button>
                    <button class="btn" onclick="next()">Next</button>
                    <button id="home-btn" class="btn" style="background:var(--accent); display:none;" onclick="window.location.href='index.html'">Finish & Return</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {"hint":"Focus on the nerve that directly carries secretomotor fibers.","question":"A 45-year-old male undergoes parotid surgery... he notices sweating on his cheek when eating (Frey's syndrome). Which nerve is responsible?","answerOptions":[{"text":"Facial nerve"},{"isCorrect":true,"rationale":"The auriculotemporal nerve carries postganglionic parasympathetic fibers.","text":"Auriculotemporal nerve"},{"text":"Great auricular nerve"},{"text":"Glossopharyngeal nerve"},{"text":"Lingual nerve"}]},
            {"hint":"Think of the nerve that loops inferiorly around the duct.","question":"A surgeon is performing an excision of the submandibular gland... which nerve loops inferiorly around this duct?","answerOptions":[{"text":"Hypoglossal nerve"},{"isCorrect":true,"rationale":"The lingual nerve loops underneath the submandibular duct.","text":"Lingual nerve"},{"text":"Glossopharyngeal nerve"},{"text":"Nerve to mylohyoid"},{"text":"Chorda tympani"}]}
        ];

        let currentIndex = 0;
        let state = quizData.map(() => ({ selected: null }));

        function startQuiz() {
            if(document.getElementById('email').value.includes('@isra.edu.pk')) {
                document.getElementById('login-gate').style.display='none';
                document.getElementById('quiz-ui').style.display='block';
                render();
            } else { alert("Use Isra Email"); }
        }

        function render() {
            const q = quizData[currentIndex];
            let html = `<div class="question-text">${q.question}</div>`;
            q.answerOptions.forEach((opt, idx) => {
                const isSel = state[currentIndex].selected === idx;
                const cls = isSel ? (opt.isCorrect ? 'selected correct' : 'selected incorrect') : '';
                html += `<li class="option-item ${cls}" onclick="select(${idx})">${String.fromCharCode(65+idx)}. ${opt.text}${isSel?`<div class="rationale">${opt.rationale||'Keep going!'}</div>`:''}</li>`;
            });
            document.getElementById('quiz-content').innerHTML = html;
            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('home-btn').style.display = currentIndex === quizData.length-1 ? 'block' : 'none';
        }

        function select(idx) { state[currentIndex].selected = idx; render(); }
        function toggleHint() { document.getElementById('hint-box').style.display = document.getElementById('hint-box').style.display==='block'?'none':'block'; }
        function next() { if(currentIndex < quizData.length-1) { currentIndex++; render(); } }
        function prev() { if(currentIndex > 0) { currentIndex--; render(); } }
    </script>
</body>
</html>
