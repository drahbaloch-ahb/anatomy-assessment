<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Salivary Glands Clinical - Prof. Baloch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
        :root { --bg: #f6f1e7; --ink: #171717; --teal: #1f6f78; --accent: #d3542c; --stroke: #e3d6c5; }
        body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--ink); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { width: 95%; max-width: 800px; padding: 30px; background: #fff7ef; border-radius: 22px; border: 1px solid var(--stroke); box-shadow: 0 18px 40px rgba(0,0,0,0.1); }
        .stats { font-family: 'Space Grotesk', sans-serif; font-weight: bold; margin-bottom: 10px; color: var(--teal); }
        .question-text { font-family: 'Space Grotesk', sans-serif; font-size: 1.25em; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
        .option-item { background: #fff; border: 1px solid var(--stroke); padding: 14px; border-radius: 12px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .option-item.correct { border: 2px solid #2e7d32; background: #f1f8e9; }
        .option-item.incorrect { border: 2px solid #c62828; background: #ffebee; }
        .rationale { font-size: 0.9em; margin-top: 8px; display: none; color: #444; padding-top: 8px; border-top: 1px solid #ddd; }
        .btn { padding: 12px 24px; border-radius: 10px; border: none; background: var(--teal); color: #fff; cursor: pointer; font-weight: 600; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--stroke); border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="login-gate">
            <h2 style="color:var(--teal)">Salivary Glands Assessment</h2>
            <p>Isra University Clinical Portal</p>
            <input type="text" id="std_name" placeholder="Student Full Name">
            <input type="text" id="std_roll" placeholder="Roll No (e.g., 22BDS05)">
            <input type="email" id="std_email" placeholder="email@isra.edu.pk">
            <button class="btn" onclick="start()">Begin Assessment</button>
        </div>

        <div id="quiz-ui" style="display:none;">
            <div class="stats">
                <span id="progress-text">1 / 4</span><br>
                <span style="color:#2e7d32">✓<span id="correct-count">0</span></span> 
                <span style="color:#c62828">✕<span id="wrong-count">0</span></span>
            </div>
            <div id="quiz-content"></div>
            <div style="margin-top:20px; display:flex; justify-content:space-between;">
                <button class="btn" style="background:#888" onclick="document.getElementById('hint-box').style.display='block'">Hint</button>
                <div style="display:flex; gap:10px;">
                    <button class="btn" onclick="prev()">Previous</button>
                    <button class="btn" id="next-btn" onclick="next()">Next</button>
                    <button class="btn" id="finish-btn" style="display:none; background:var(--accent)" onclick="showFeedback()">Finish</button>
                </div>
            </div>
            <div id="hint-box" style="display:none; margin-top:10px; padding:15px; background:#fff; border:1px solid var(--stroke); border-radius:10px;">💡 <span id="hint-text"></span></div>
        </div>

        <div id="feedback-ui" style="display:none; text-align:center;">
            <h3>Feedback for Prof. Baloch</h3>
            <textarea id="feedback_msg" style="width:100%; height:100px; border-radius:8px; padding:10px;" placeholder="Type your comments here..."></textarea><br><br>
            <button class="btn" id="sub-btn" onclick="submitData()">Submit & Exit</button>
        </div>
    </div>

    <script>
        const quizData = [
            { q: "A 45-year-old male undergoes surgery for a tumor within his parotid gland. Several months post-operation, he notices sweating on the skin of his cheek whenever he eats. This is diagnosed as Frey's syndrome. Which nerve's regenerating parasympathetic fibers are responsible for this clinical sign?", 
              options: ["Facial nerve", "Auriculotemporal nerve", "Great auricular nerve", "Glossopharyngeal nerve", "Lingual nerve"], correct: 1, 
              rat: "The auriculotemporal nerve carries postganglionic parasympathetic fibers to the parotid gland; aberrant regeneration leads to innervation of sweat glands.", 
              hint: "Focus on the nerve that carries secretomotor fibers to the gland." },
            { q: "A patient presents with significant swelling over the angle of their jaw, which is painful and worsens when they are hungry. A diagnosis of acute parotitis is made. To enter the oral vestibule, the parotid duct must pierce which muscle?", 
              options: ["Masseter", "Medial pterygoid", "Buccinator", "Sternocleidomastoid", "Styloglossus"], correct: 2, 
              rat: "The parotid duct pierces the buccinator muscle opposite the upper second molar tooth.", 
              hint: "It is the main muscle of the cheek." },
            { q: "During a surgical procedure to remove a tumor in the parotid gland, the surgeon must identify the structures within the gland substance. Which structure is located most medially within the parotid bed?", 
              options: ["Facial nerve", "Retromandibular vein", "External carotid artery", "Parotid lymph nodes", "Great auricular nerve"], correct: 2, 
              rat: "The External Carotid Artery is the deepest (most medial) structure in the parotid gland.", 
              hint: "Recall the depth: Nerve (Superficial), Vein (Intermediate), Artery (Deep)." },
            { q: "A surgeon is performing an excision of the submandibular gland. During the dissection, the submandibular duct is identified. Which nerve loops inferiorly around this duct?", 
              options: ["Hypoglossal nerve", "Lingual nerve", "Glossopharyngeal nerve", "Nerve to mylohyoid", "Chorda tympani"], correct: 1, 
              rat: "The lingual nerve loops under the submandibular duct as it passes from the lateral to the medial side.", 
              hint: "This nerve provides sensation to the anterior 2/3 of the tongue." }
        ];

        let cur = 0, state = quizData.map(() => null), correct = 0, wrong = 0, student = {};

        function start() {
            student = { name: document.getElementById('std_name').value, roll: document.getElementById('std_roll').value, email: document.getElementById('std_email').value };
            if(!student.name || !student.roll || !student.email.includes('@isra.edu.pk')) return alert("Please enter Name, Roll No, and Isra Email.");
            document.getElementById('login-gate').style.display='none';
            document.getElementById('quiz-ui').style.display='block';
            render();
        }

        function render() {
            const d = quizData[cur];
            document.getElementById('progress-text').innerText = (cur + 1) + " / 4";
            document.getElementById('correct-count').innerText = correct;
            document.getElementById('wrong-count').innerText = wrong;
            let html = `<div class="question-text">${d.q}</div>`;
            d.options.forEach((o, i) => {
                const isSel = state[cur] === i;
                const cls = isSel ? (i === d.correct ? 'correct' : 'incorrect') : '';
                html += `<div class="option-item ${cls}" onclick="select(${i})"><strong>${String.fromCharCode(65+i)}.</strong> ${o}<div class="rationale" style="display:${isSel?'block':'none'}">${d.rat}</div></div>`;
            });
            document.getElementById('quiz-content').innerHTML = html;
            document.getElementById('hint-text').innerText = d.hint;
            document.getElementById('hint-box').style.display = 'none';
            document.getElementById('finish-btn').style.display = (cur === 3 && state[cur] !== null) ? 'block' : 'none';
            document.getElementById('next-btn').style.display = (cur === 3) ? 'none' : 'block';
        }

        function select(i) {
            if(state[cur] === null) {
                state[cur] = i;
                if(i === quizData[cur].correct) correct++; else wrong++;
                render();
            }
        }
        function next() { if(cur < 3) { cur++; render(); } }
        function prev() { if(cur > 0) { cur--; render(); } }
        function showFeedback() { document.getElementById('quiz-ui').style.display='none'; document.getElementById('feedback-ui').style.display='block'; }

        async function submitData() {
            const btn = document.getElementById('sub-btn');
            btn.disabled = true; btn.innerText = "Saving...";
            const payload = { ...student, topic: "Salivary Glands", score: correct, feedback: document.getElementById('feedback_msg').value };
            try {
                // REPLACE THIS URL WITH YOUR NEW WEB APP URL
                await fetch('https://script.google.com/macros/s/AKfycbzilEQ16fP0TT6yExRKR4al0ENTQJ7j-jOrvoEYDbyo4hyK5PWQVW5vRQ_YEshE6_Hk/exec', { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                alert("Assessment Submitted!"); window.location.href = 'index.html';
            } catch(e) { alert("Submission Error."); btn.disabled = false; }
        }
        render();
    </script>
</body>
</html>
