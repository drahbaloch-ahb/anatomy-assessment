<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tongue Lecture - Clinical Anatomy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

        :root {
            --bg: #f6f1e7; --bg-deep: #efe4d6; --ink: #171717; --muted: #5b5b5b;
            --accent: #d3542c; --accent-light: #ff8f5a; --accent-dark: #b14320;
            --teal: #1f6f78; --card: #fff7ef; --stroke: #e3d6c5;
            --shadow: 0 18px 40px rgba(23, 23, 23, 0.12);
            --radius-md: 12px; --radius-lg: 14px; --radius-2xl: 22px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'IBM Plex Sans', sans-serif;
            --error: #b54832;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--ink); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .quiz-container { width: 100%; max-width: 800px; padding: 32px 20px; background: var(--card); border-radius: var(--radius-2xl); border: 1px solid var(--stroke); box-shadow: var(--shadow); }
        .progress-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .status-bar { display: flex; gap: 16px; font-weight: 500; }
        .status-correct { color: var(--teal); }
        .status-wrong { color: var(--error); }
        .question-text { font-family: var(--font-display); font-size: 1.5em; font-weight: 600; margin-bottom: 32px; line-height: 1.4; }
        .options-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; }
        .option-item { background-color: #fff; border: 1px solid var(--stroke); padding: 12px 16px; border-radius: var(--radius-lg); cursor: pointer; transition: 0.2s; }
        .option-item.selected.correct { background-color: rgba(31, 111, 120, 0.12); border-color: var(--teal); }
        .option-item.selected.incorrect { background-color: rgba(181, 72, 50, 0.12); border-color: var(--error); }
        .rationale { font-size: 0.95em; color: var(--muted); margin-top: 8px; display: none; }
        .selected .rationale { display: block; }
        .hint-content { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid var(--stroke); border-radius: var(--radius-lg); display: none; }
        .hint-content.active { display: block; }
        .navigation { margin-top: 32px; display: flex; justify-content: space-between; }
        .btn { padding: 10px 20px; border-radius: var(--radius-md); cursor: pointer; border: 1px solid var(--stroke); font-weight: 600; }
        .btn-next { background: var(--accent); color: white; border: none; }
        .home-link { display: block; margin-bottom: 20px; color: var(--teal); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <a href="index.html" class="home-link">← Back to Main Portal</a>
        <div id="quiz-content"></div>
        <div id="hint-box" class="hint-content"><strong>💡 Hint:</strong> <span id="hint-text"></span></div>
        <div class="navigation">
            <button id="hint-toggle" class="btn">Show Hint</button>
            <div>
                <button id="prev-btn" class="btn">Previous</button>
                <button id="next-btn" class="btn btn-next">Next</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {"question":"A 55-year-old male... tongue is observed to deviate towards the left side. What specific structure is most likely injured?","answerOptions":[{"text":"Left hypoglossal nerve","isCorrect":true,"rationale":"Injury to this nerve causes paralysis of the ipsilateral genioglossus muscle, leading to deviation towards the paralyzed side..."},{"text":"Right hypoglossal nerve","isCorrect":false,"rationale":"An injury to the right hypoglossal nerve would cause the tongue to deviate to the right side..."},{"text":"Lingual nerve","isCorrect":false,"rationale":"The lingual nerve provides general sensation..."},{"text":"Glossopharyngeal nerve","isCorrect":false,"rationale":"This nerve is primarily associated with sensation and taste for the posterior third..."},{"text":"Chorda tympani","isCorrect":false,"rationale":"This branch of the facial nerve carries taste sensation..."}],"hint":"Consider the motor nerve responsible for the action of the genioglossus muscle..."},
            {"question":"An anesthesiologist is monitoring a patient... tongue falls posteriorly, causing an airway obstruction. Which muscle's relaxation is the primary cause?","answerOptions":[{"text":"Styloglossus","isCorrect":false,"rationale":"..."},{"text":"Hyoglossus","isCorrect":false,"rationale":"..."},{"text":"Palatoglossus","isCorrect":false,"rationale":"..."},{"text":"Genioglossus","isCorrect":true,"rationale":"This fan-shaped muscle makes up the bulk of the tongue and its primary role is to protrude the tongue..."},{"text":"Mylohyoid","isCorrect":false,"rationale":"..."}],"hint":"Think about the largest of the extrinsic tongue muscles..."},
            {"question":"A patient... prescribed sublingual nitroglycerin... Which vascular structure is primarily responsible for this rapid uptake?","answerOptions":[{"text":"Lingual artery","isCorrect":false,"rationale":"..."},{"text":"Deep lingual vein","isCorrect":true,"rationale":"These large veins are located close to the surface under the thin mucosa..."},{"text":"Submandibular ganglion","isCorrect":false,"rationale":"..."},{"text":"Submental artery","isCorrect":false,"rationale":"..."},{"text":"Jugular vein","isCorrect":false,"rationale":"..."}],"hint":"Look for a superficial vessel located on the inferior surface of the tongue..."},
            {"question":"During an oral cancer screening... A V-shaped groove is noted... dividing the anterior oral part from the posterior pharyngeal part. What is this landmark?","answerOptions":[{"text":"Median furrow","isCorrect":false,"rationale":"..."},{"text":"Frenulum","isCorrect":false,"rationale":"..."},{"text":"Sulcus terminalis","isCorrect":true,"rationale":"This V-shaped groove correctly identifies the division..."},{"text":"Foramen cecum","isCorrect":false,"rationale":"..."},{"text":"Palatoglossal arch","isCorrect":false,"rationale":"..."}],"hint":"This structure's name suggests it is a terminal groove..."}
        ];

        let currentIndex = 0;
        let state = quizData.map(() => ({ selectedIndex: null, hintVisible: false }));

        function render() {
            const q = quizData[currentIndex];
            const s = state[currentIndex];
            const correctCount = state.filter((item, i) => item.selectedIndex !== null && quizData[i].answerOptions[item.selectedIndex].isCorrect).length;
            
            document.getElementById('quiz-content').innerHTML = `
                <div class="progress-container">
                    <span>Question ${currentIndex + 1} of ${quizData.length}</span>
                    <div class="status-bar"><span class="status-correct">✓ ${correctCount}</span></div>
                </div>
                <div class="question-text">${q.question}</div>
                <ul class="options-list">
                    ${q.answerOptions.map((opt, i) => `
                        <li class="option-item ${s.selectedIndex === i ? 'selected ' + (opt.isCorrect ? 'correct' : 'incorrect') : ''}" onclick="select(${i})">
                            <strong>${String.fromCharCode(65+i)}.</strong> ${opt.text}
                            <div class="rationale">${opt.rationale}</div>
                        </li>
                    `).join('')}
                </ul>`;
            
            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('hint-box').style.display = s.hintVisible ? 'block' : 'none';
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === quizData.length - 1;
        }

        window.select = (i) => { if(state[currentIndex].selectedIndex === null) { state[currentIndex].selectedIndex = i; render(); } };
        document.getElementById('hint-toggle').onclick = () => { state[currentIndex].hintVisible = !state[currentIndex].hintVisible; render(); };
        document.getElementById('prev-btn').onclick = () => { if(currentIndex > 0) { currentIndex--; render(); } };
        document.getElementById('next-btn').onclick = () => { if(currentIndex < quizData.length - 1) { currentIndex++; render(); } };
        render();
    </script>
</body>
</html>
