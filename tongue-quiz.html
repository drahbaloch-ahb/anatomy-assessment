<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tongue Clinical - Prof. Baloch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
        :root { --bg: #f6f1e7; --ink: #171717; --teal: #1f6f78; --accent: #d3542c; --stroke: #e3d6c5; }
        body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--ink); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { width: 95%; max-width: 800px; padding: 30px; background: #fff7ef; border-radius: 22px; border: 1px solid var(--stroke); box-shadow: 0 18px 40px rgba(0,0,0,0.1); }
        .stats { font-family: 'Space Grotesk', sans-serif; font-weight: bold; margin-bottom: 10px; color: var(--teal); }
        .question-text { font-family: 'Space Grotesk', sans-serif; font-size: 1.25em; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
        .option-item { background: #fff; border: 1px solid var(--stroke); padding: 14px; border-radius: 12px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; border-left: 5px solid transparent; }
        .option-item.correct { border: 2px solid #2e7d32; background: #f1f8e9; border-left: 5px solid #2e7d32; }
        .option-item.incorrect { border: 2px solid #c62828; background: #ffebee; border-left: 5px solid #c62828; }
        .rationale { font-size: 0.9em; margin-top: 8px; display: none; color: #444; padding: 10px; background: #fdfdfd; border-radius: 5px; border-top: 1px solid #ddd; }
        .btn { padding: 12px 24px; border-radius: 10px; border: none; background: var(--teal); color: #fff; cursor: pointer; font-weight: 600; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--stroke); border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="login-gate">
            <h2 style="color:var(--teal)">Tongue Clinical Module</h2>
            <p>Isra University Portal - Dr. Abdul Hafeez Baloch</p>
            <input type="text" id="std_name" placeholder="Student Full Name">
            <input type="text" id="std_roll" placeholder="Roll Number (e.g. 23BDS45)">
            <input type="email" id="std_email" placeholder="student@isra.edu.pk">
            <button type="button" class="btn" onclick="beginQuiz()">Begin Assessment</button>
        </div>

        <div id="quiz-ui" style="display:none;">
            <div class="stats">
                <span id="progress-text">1 / 4</span><br>
                <span style="color:#2e7d32">✓ <span id="correct-count">0</span></span> 
                <span style="color:#c62828">✕ <span id="wrong-count">0</span></span>
            </div>
            <div id="quiz-content"></div>
            <div style="margin-top:20px; display:flex; justify-content:space-between;">
                <button class="btn" style="background:#888" onclick="showHint()">Hint</button>
                <div style="display:flex; gap:10px;">
                    <button class="btn" onclick="prev()">Previous</button>
                    <button class="btn" id="next-btn" onclick="next()">Next</button>
                    <button class="btn" id="finish-btn" style="display:none; background:var(--accent)" onclick="toFeedback()">Finish</button>
                </div>
            </div>
            <div id="hint-box" style="display:none; margin-top:10px; padding:15px; background:#fff; border:1px solid var(--stroke); border-radius:10px;">💡 <span id="hint-text"></span></div>
        </div>

        <div id="feedback-ui" style="display:none; text-align:center;">
            <h3>Clinical Feedback</h3>
            <textarea id="feedback_msg" style="width:100%; height:100px; border-radius:8px; padding:10px; box-sizing:border-box;" placeholder="Enter your comments for Prof. Baloch..."></textarea><br><br>
            <button class="btn" id="sub-btn" onclick="finalSubmit()">Submit to Sheet & Exit</button>
        </div>
    </div>

    <script>
        const quizData = [
            { 
              q: "A 55-year-old male is brought to the emergency room following a mandible fracture sustained in a car accident. During a neurological exam, the physician asks the patient to protrude his tongue. The tongue is observed to deviate towards the left side. What specific structure is most likely injured?", 
              options: ["Left hypoglossal nerve", "Right hypoglossal nerve", "Left glossopharyngeal nerve", "Right glossopharyngeal nerve", "Left lingual nerve"], 
              correct: 0, 
              rat: "In LMN lesions of the hypoglossal nerve, the tongue deviates to the paralyzed side. The healthy genioglossus on the opposite side pushes the tongue toward the weak side.", 
              hint: "Recall: The tongue points towards the side of the lesion." 
            },
            { 
              q: "Which extrinsic muscle of the tongue is termed the 'safety muscle' because its contraction prevents the tongue from falling backward and obstructing the airway?", 
              options: ["Hyoglossus", "Styloglossus", "Genioglossus", "Palatoglossus", "Chondroglossus"], 
              correct: 2, 
              rat: "Genioglossus is the safety muscle. Its bilateral contraction pulls the tongue forward, maintaining a clear airway.", 
              hint: "It is the fan-shaped muscle forming the bulk of the tongue." 
            },
            { 
              q: "A patient presents with a malignant tumor on the lateral margin of the tongue. Primary lymphatic drainage from this area would most likely go to which lymph nodes first?", 
              options: ["Submental nodes", "Submandibular nodes", "Superior deep cervical nodes", "Inferior deep cervical nodes", "Parotid nodes"], 
              correct: 1, 
              rat: "The lateral margins drain into the submandibular lymph nodes before reaching deep cervical nodes.", 
              hint: "Identify nodes located under the body of the mandible." 
            },
            { 
              q: "A 25-year-old undergoes extraction of an impacted mandibular third molar. Afterwards, they report loss of general sensation and taste from the anterior 2/3 of the tongue. Which nerve was likely injured?", 
              options: ["Hypoglossal nerve", "Lingual nerve", "Chorda tympani", "Glossopharyngeal nerve", "Mandibular nerve"], 
              correct: 1, 
              rat: "The lingual nerve carries sensation and taste (via chorda tympani) and is closely related to the lower 3rd molar socket.", 
              hint: "This nerve loops under the submandibular duct." 
            }
        ];

        let cur = 0, state = [null, null, null, null], correctCount = 0, wrongCount = 0, studentData = {};

        function beginQuiz() {
            const name = document.getElementById('std_name').value;
            const roll = document.getElementById('std_roll').value;
            const email = document.getElementById('std_email').value;

            if(!name || !roll || !email.includes('@isra.edu.pk')) {
                alert("Please complete all fields using @isra.edu.pk email.");
                return;
            }

            studentData = { name, roll, email };
            document.getElementById('login-gate').style.display = 'none';
            document.getElementById('quiz-ui').style.display = 'block';
            render();
        }

        function render() {
            const data = quizData[cur];
            document.getElementById('progress-text').innerText = (cur + 1) + " / 4";
            document.getElementById('correct-count').innerText = correctCount;
            document.getElementById('wrong-count').innerText = wrongCount;

            let html = `<div class="question-text">${data.q}</div>`;
            data.options.forEach((opt, idx) => {
                const isSelected = state[cur] === idx;
                const cssClass = isSelected ? (idx === data.correct ? 'correct' : 'incorrect') : '';
                html += `<div class="option-item ${cssClass}" onclick="handleSelection(${idx})">
                    <strong>${String.fromCharCode(65 + idx)}.</strong> ${opt}
                    <div class="rationale" style="display:${isSelected ? 'block' : 'none'}">${data.rat}</div>
                </div>`;
            });

            document.getElementById('quiz-content').innerHTML = html;
            document.getElementById('hint-text').innerText = data.hint;
            document.getElementById('hint-box').style.display = 'none';
            document.getElementById('finish-btn').style.display = (cur === 3 && state[cur] !== null) ? 'inline-block' : 'none';
            document.getElementById('next-btn').style.display = (cur === 3) ? 'none' : 'inline-block';
        }

        function handleSelection(idx) {
            if(state[cur] === null) {
                state[cur] = idx;
                if(idx === quizData[cur].correct) correctCount++; else wrongCount++;
                render();
            }
        }

        function next() { if(cur < 3) { cur++; render(); } }
        function prev() { if(cur > 0) { cur--; render(); } }
        function showHint() { document.getElementById('hint-box').style.display = 'block'; }
        function toFeedback() { document.getElementById('quiz-ui').style.display = 'none'; document.getElementById('feedback-ui').style.display = 'block'; }

        async function finalSubmit() {
            const btn = document.getElementById('sub-btn');
            btn.disabled = true;
            btn.innerText = "Recording...";

            const finalData = { 
                ...studentData, 
                topic: "Tongue", 
                score: correctCount, 
                feedback: document.getElementById('feedback_msg').value 
            };

            try {
                await fetch('https://script.google.com/macros/s/AKfycbzilEQ16fP0TT6yExRKR4al0ENTQJ7j-jOrvoEYDbyo4hyK5PWQVW5vRQ_YEshE6_Hk/exec', {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(finalData)
                });
                alert("Data recorded successfully!");
                window.location.href = 'index.html';
            } catch (err) {
                alert("Submission error.");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
