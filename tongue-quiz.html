<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tongue Clinical Assessment - Prof. Baloch</title>
    <style>
        :root { --teal: #1f6f78; --accent: #d3542c; --bg: #f6f1e7; --card: #fff7ef; }
        body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .quiz-container { width: 95%; max-width: 800px; padding: 30px; background: var(--card); border-radius: 22px; border: 1px solid #e3d6c5; box-shadow: 0 18px 40px rgba(0,0,0,0.1); }
        #auth-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .btn-start { background: var(--teal); color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .hidden { display: none !important; }
        .option-item { background: white; border: 1px solid #e3d6c5; padding: 15px; margin: 10px 0; border-radius: 12px; cursor: pointer; }
        .correct { background: #d1e7dd !important; border-color: #a3cfbb !important; }
        .incorrect { background: #f8d7da !important; border-color: #f5c2c7 !important; }
        .rationale { font-size: 0.9em; color: #555; margin-top: 10px; display: none; padding: 10px; border-left: 3px solid var(--teal); background: #f9f9f9; }
        .selected .rationale { display: block; }
        .hint-box { background: #fff; padding: 15px; border-radius: 10px; border: 1px dashed var(--teal); margin-top: 15px; display: none; color: #555; font-style: italic; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2 style="color: var(--teal);">Isra University Portal</h2>
            <p>Clinical Anatomy - Tongue Lecture</p>
            <input type="text" id="studentName" placeholder="Full Name" required>
            <input type="text" id="rollNo" placeholder="Roll Number" required>
            <input type="email" id="studentEmail" placeholder="Email (@isra.edu.pk)" required>
            <button class="btn-start" onclick="startQuiz()">Enter Quiz</button>
        </div>
    </div>

    <div class="quiz-container hidden" id="main-quiz">
        <div id="quiz-content"></div>
        <div id="hint-text" class="hint-box"></div>
        <div id="navigation" style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
            <button onclick="toggleHint()" style="padding: 10px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; background: white;">💡 Show Hint</button>
            <div style="font-weight: bold; color: var(--teal);" id="counter"></div>
            <button id="nextBtn" onclick="handleNext()" style="padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer;">Next Question</button>
        </div>
    </div>

    <script>
        // Replace with your Google Script URL
        const scriptURL = 'PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE'; 

        const quizData = [
            {"question":"A 55-year-old male... tongue deviates towards the left side...","options":["Left hypoglossal nerve","Right hypoglossal nerve","Lingual nerve","Glossopharyngeal nerve","Chorda tympani"],"answer":0,"hint":"Consider the motor nerve responsible for genioglossus protrusion.","rationale":"Injury causes paralysis of the ipsilateral genioglossus muscle."},
            {"question":"Anesthetized patient... tongue falls posteriorly... cause?","options":["Styloglossus","Hyoglossus","Palatoglossus","Genioglossus","Mylohyoid"],"answer":3,"hint":"Think about the bulk of the tongue that prevents airway blockage.","rationale":"The genioglossus is the primary protruder of the tongue."},
            {"question":"Sublingual nitroglycerin uptake... structure?","options":["Lingual artery","Deep lingual vein","Submandibular ganglion","Submental artery","Jugular vein"],"answer":1,"hint":"Look for a superficial vessel on the inferior surface.","rationale":"Deep lingual veins provide rapid systemic absorption."},
            {"question":"V-shaped groove dividing anterior/posterior tongue?","options":["Median furrow","Frenulum","Sulcus terminalis","Foramen cecum","Palatoglossal arch"],"answer":2,"hint":"Its name suggests a terminal boundary.","rationale":"The sulcus terminalis is the V-shaped division."}
        ];

        let currentIdx = 0;
        let studentData = {};
        let score = 0;
        let selectedAnswers = Array(quizData.length).fill(null);

        function startQuiz() {
            const name = document.getElementById('studentName').value;
            const roll = document.getElementById('rollNo').value;
            const email = document.getElementById('studentEmail').value;
            if(!email.endsWith('@isra.edu.pk')) { alert("Please use your @isra.edu.pk email."); return; }
            studentData = { name, roll, email };
            document.getElementById('auth-overlay').classList.add('hidden');
            document.getElementById('main-quiz').classList.remove('hidden');
            render();
        }

        function render() {
            const q = quizData[currentIdx];
            document.getElementById('counter').innerText = `Case ${currentIdx + 1} of ${quizData.length}`;
            let html = `<h3>Question ${currentIdx + 1}</h3><p style="font-size: 1.1em;">${q.question}</p>`;
            q.options.forEach((opt, i) => {
                let status = "";
                if(selectedAnswers[currentIdx] !== null) {
                    if(i === q.answer) status = "correct selected";
                    else if(i === selectedAnswers[currentIdx]) status = "incorrect selected";
                }
                html += `<div class="option-item ${status}" onclick="check(${i})">${String.fromCharCode(65+i)}. ${opt}<div class="rationale">${q.rationale}</div></div>`;
            });
            document.getElementById('quiz-content').innerHTML = html;
            document.getElementById('hint-text').innerText = "Hint: " + q.hint;
            document.getElementById('hint-text').style.display = "none";
            document.getElementById('nextBtn').innerText = currentIdx === quizData.length - 1 ? "Finish & Submit" : "Next Question";
        }

        function check(idx) {
            if(selectedAnswers[currentIdx] !== null) return;
            selectedAnswers[currentIdx] = idx;
            if(idx === quizData[currentIdx].answer) score++;
            render();
        }

        function toggleHint() {
            const h = document.getElementById('hint-text');
            h.style.display = h.style.display === "none" ? "block" : "none";
        }

        function handleNext() {
            if(selectedAnswers[currentIdx] === null) { alert("Please select an answer."); return; }
            if(currentIdx < quizData.length - 1) {
                currentIdx++;
                render();
            } else {
                submitResults();
            }
        }

        function submitResults() {
            document.getElementById('main-quiz').innerHTML = "<h2>Sending results to Prof. Baloch...</h2>";
            const final = { ...studentData, score: `${score}/${quizData.length}`, topic: "Tongue" };
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(final) })
            .then(() => {
                document.getElementById('main-quiz').innerHTML = "<h2 style='color:var(--teal)'>Assessment Complete!</h2><p>Your score has been recorded. You can now close this page or return to the main portal.</p><button onclick=\"location.href='index.html'\" class='btn-start'>Back to Portal</button>";
            });
        }
    </script>
</body>
</html>
